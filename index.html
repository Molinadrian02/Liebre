<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1117">
<title>Liebre</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una columna estrecha tipo reloj deportivo; cifras grandes y el estado del ritmo pinta toda la pantalla de carrera */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --line:#D9DEE6; --fg:#111720; --muted:#596476;
  --accent:#2350D8; --accent-fg:#FFFFFF;
  --in:#12825A; --fast:#D2541A; --slow:#6A4BE0;
  --in-soft:#DCF2E8; --fast-soft:#FBE4D7; --slow-soft:#E8E2FC; --pause-soft:#E7EAEF;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1117; --surface:#171B23; --line:#2A303B; --fg:#EEF1F5; --muted:#99A3B4;
    --accent:#7393FF; --accent-fg:#0E1117;
    --in:#3FCB8E; --fast:#FF8B4E; --slow:#A68FFF;
    --in-soft:#11291E; --fast-soft:#33190C; --slow-soft:#211A40; --pause-soft:#1C2029;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.05;text-wrap:balance}
.num,.tab{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 96px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px}
#app.running{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);min-height:100vh}

/* ---- Cabeceras ---- */
.top h1{font-size:44px;letter-spacing:.01em}
.top h1 em{font-style:normal;color:var(--accent)}
.sub{margin:6px 0 0;color:var(--muted)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h2{font-size:24px}
.hint{margin:4px 0 12px;color:var(--muted);font-size:15px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* ---- Botones ---- */
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:600;cursor:pointer;background:var(--surface);border:1px solid var(--line);min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 14px;min-height:36px;font-size:15px}
.btn.danger{color:var(--fast);border-color:var(--fast)}
.btn.block{width:100%}
.btn:focus-visible,.chip:focus-visible,.in:focus-visible,.icon:focus-visible,.tabbar button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;flex:none;font-size:18px;line-height:1}

/* ---- Inicio ---- */
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.chip span{font-size:14px;color:var(--muted)}
.chip b{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:12px}
.routine{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.routine h3{font-size:24px}
.r-steps{margin:6px 0 0;font-size:15px}
.r-meta{margin:4px 0 0;color:var(--muted);font-size:14px}
.r-note{margin:6px 0 0;color:var(--muted);font-size:14px}
.r-actions{display:flex;gap:8px;align-items:center}
.r-actions .primary{flex:1}

/* ---- Carrera ---- */
.run{--tone:var(--fg);--wash:var(--bg);background:var(--wash);margin:calc(-1*(env(safe-area-inset-top,0px) + 20px)) calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;min-height:100vh;transition:background-color .35s}
.run[data-state="in"]{--tone:var(--in);--wash:var(--in-soft)}
.run[data-state="fast"]{--tone:var(--fast);--wash:var(--fast-soft)}
.run[data-state="slow"]{--tone:var(--slow);--wash:var(--slow-soft)}
.run[data-state="paused"]{--wash:var(--pause-soft)}
@media (prefers-reduced-motion:reduce){.run{transition:none}}
.run-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.run-top .blk{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.05}
.range{text-align:right;flex:none}
.range span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.range b{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.pace-wrap{text-align:center;padding:8px 0 0}
.pace{font-family:var(--display);font-weight:700;font-size:clamp(112px,34vw,176px);line-height:.9;color:var(--tone);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.unit{color:var(--muted);font-size:14px;letter-spacing:.06em;margin-top:2px}
.status{margin-top:10px;font-family:var(--display);font-size:28px;font-weight:600;color:var(--tone)}
.gauge{position:relative;height:54px}
.g-track{position:absolute;left:0;right:0;top:8px;height:14px;border-radius:7px;background:var(--surface);border:1px solid var(--line)}
.g-band{position:absolute;top:8px;height:14px;background:var(--in);opacity:.35;border-radius:7px}
.g-mark{position:absolute;top:0;width:6px;height:30px;margin-left:-3px;border-radius:3px;background:var(--tone);transition:left .6s ease}
@media (prefers-reduced-motion:reduce){.g-mark{transition:none}}
.g-labels{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.blkprog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.bp-row{display:flex;align-items:baseline;gap:10px}
.bp-rem{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bp-lab{color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.next{font-size:15px;color:var(--muted)}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.totals div{display:flex;flex-direction:column}
.totals span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.totals b{font-family:var(--display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:8px;margin-top:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.controls .btn{flex:1;min-height:56px;font-size:17px}
.overlay{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px}
.overlay h3{font-size:28px}
.overlay p{margin:0;color:var(--muted);font-size:15px}
.gps{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;background:var(--fast)}
.dot.ok{background:var(--in)}
.dot.mid{background:var(--slow)}
.cd{font-family:var(--display);font-size:120px;font-weight:700;text-align:center;line-height:1;color:var(--accent)}
.err{color:var(--fast);font-weight:600}

/* ---- Resumen e historial ---- */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.chart-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 8px;overflow-x:auto}
.chart-box svg{display:block;width:100%;height:auto;min-width:320px}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-txt{fill:var(--muted);font:19px var(--body);font-variant-numeric:tabular-nums}
.ch-band{fill:var(--in);opacity:.18}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);padding:6px 8px 0;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:600;background:var(--pause-soft)}
.pill.good{background:var(--in-soft);color:var(--in)}
.pill.mid{background:var(--slow-soft);color:var(--slow)}
.pill.bad{background:var(--fast-soft);color:var(--fast)}
.hist{display:flex;flex-direction:column}
.h-item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.h-item:first-child{border-top:1px solid var(--line)}
.h-main{flex:1;min-width:0}
.h-main b{display:block;font-size:17px}
.h-main span{color:var(--muted);font-size:14px}
.h-nums{text-align:right;font-variant-numeric:tabular-nums}
.h-nums b{font-family:var(--display);font-size:24px;font-weight:600;display:block;line-height:1.1}
.empty{color:var(--muted);padding:24px 0}
.back{align-self:flex-start}

/* ---- Ajustes y editor ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:14px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.zrow{display:grid;grid-template-columns:minmax(0,1fr) 82px 14px 82px;gap:8px;align-items:center}
.zrow span.dash{text-align:center;color:var(--muted)}
.in{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
.in.num{text-align:center;font-variant-numeric:tabular-nums}
.in.bad{border-color:var(--fast)}
.slider{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.slider input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.slider output{font-variant-numeric:tabular-nums;color:var(--muted)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.small{font-size:14px;color:var(--muted);margin:0}
.ed-block{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ed-line{display:grid;grid-template-columns:72px 76px minmax(0,1fr) 40px;gap:8px;align-items:center}
.ed-repeat{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;border:2px dashed var(--accent);}
.rep-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rep-head b{font-family:var(--display);font-size:28px;min-width:28px;text-align:center}
.rep-head .grow{flex:1}
.ed-list{display:flex;flex-direction:column;gap:10px}
.confirm{color:var(--fast);font-weight:600}

/* ---- Plan ---- */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daychip{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer}
.daychip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.today{background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.today h3{font-size:30px}
.refline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.refline b{color:var(--fg);font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));gap:4px;font-variant-numeric:tabular-nums}
.cal .h{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.cal .wk{font-size:12px;color:var(--muted);display:flex;align-items:center;font-weight:600}
.cal .wk.cur{color:var(--accent)}
.cell{aspect-ratio:1;max-width:100%;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.cell.plan{border:1.5px solid var(--muted);color:var(--fg)}
.cell.done{background:var(--in);color:var(--bg);font-weight:700}
.cell.missed{background:var(--fast-soft);color:var(--fast);border:1.5px solid var(--fast)}
.cell.race{background:var(--accent);color:var(--accent-fg);font-weight:700}
.cell.now{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.legend2{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-top:10px}
.legend2 i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.sess{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.sess:last-child{border-bottom:0}
.s-date{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.s-date b{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.s-date span{font-family:var(--display);font-size:28px;font-weight:700}
.sess.today .s-date span,.sess.today .s-date b{color:var(--accent)}
.sess.rest{padding:8px 0}
.sess.rest .s-date span{font-size:20px;color:var(--muted)}
.s-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.s-main b{font-size:17px}
.s-main span{font-size:14px;color:var(--muted)}
.s-act{grid-column:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.wkcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px}
details.fut{border-bottom:1px solid var(--line)}
details.fut summary{padding:12px 0;cursor:pointer;display:flex;justify-content:space-between;gap:10px;list-style:none}
details.fut summary::-webkit-details-marker{display:none}
details.fut summary span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
details.fut ul{margin:0 0 12px;padding-left:18px;color:var(--muted);font-size:15px}
.log{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.log li{font-size:14px;padding-left:12px;border-left:3px solid var(--line)}
.log li span{color:var(--muted);font-size:12px;display:block}
.rpe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rpe-b{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.rpe-b b{font-family:var(--display);font-size:28px;line-height:1}
.rpe-b span{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.15}
.note-box{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--slow-soft)}

/* ---- Barra de pestañas ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabbar button{flex:1;max-width:186px;background:none;border:0;padding:14px 4px 16px;font-weight:600;color:var(--muted);cursor:pointer;font-size:15px}
.tabbar button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:9;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar">
  <button data-view="home">Entrenar</button>
  <button data-view="plan">Plan</button>
  <button data-view="history">Historial</button>
  <button data-view="settings">Ajustes</button>
</nav>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const store={
  get(k,d){try{const v=localStorage.getItem('liebre.'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('liebre.'+k,JSON.stringify(v))}catch(e){toast('No se ha podido guardar en este navegador')}}
};
const pad=n=>String(n).padStart(2,'0');
const fmtPace=s=>{if(s==null||!isFinite(s))return '–:––';s=Math.round(s);return Math.floor(s/60)+':'+pad(s%60)};
const parsePace=str=>{const m=String(str).trim().match(/^(\d{1,2})\s*[:.,']\s*(\d{1,2})$/);if(!m||+m[2]>59)return null;return +m[1]*60+ +m[2]};
const fmtDur=ms=>{let s=Math.max(0,Math.round(ms/1000));const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`};
const fmtKm=(m,d=2)=>(m/1000).toFixed(d).replace('.',',');
const paceWords=s=>{s=Math.round(s);const m=Math.floor(s/60),r=s%60;return r===0?`${m} en punto`:`${m} ${r<10?'cero '+r:r}`};
function hav(a,b){const R=6371000,toR=Math.PI/180;const dLa=(b.lat-a.lat)*toR,dLo=(b.lon-a.lon)*toR;const x=Math.sin(dLa/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

/* ============ datos ============ */
// Ritmos en segundos por km. min = el más rápido del rango, max = el más lento.
const DEFAULT_ZONES={
  suave:{name:'Suave',min:410,max:450},
  carrera:{name:'Ritmo 10K',min:360,max:375},
  umbral:{name:'Umbral',min:355,max:370},
  series:{name:'Series',min:325,max:340}
};
const B=(label,kind,value,zone)=>({type:'block',label,kind,value,zone});
const R=(n,blocks)=>({type:'repeat',n,blocks});
const DEFAULT_ROUTINES=[
  {id:'r-suave',name:'Rodaje suave',note:'Base aeróbica. Tienes que poder hablar mientras corres.',steps:[B('Rodaje','time',1800,'suave')]},
  {id:'r-series',name:'Series 6×400 m',note:'Velocidad. En la recuperación trota muy suave o anda.',steps:[B('Calentamiento','time',600,'suave'),R(6,[B('Serie','dist',400,'series'),B('Recuperación','time',90,'libre')]),B('Vuelta a la calma','time',480,'suave')]},
  {id:'r-umbral',name:'Umbral 3×8 min',note:'Exigente pero controlado: puedes decir frases cortas, no conversar.',steps:[B('Calentamiento','time',600,'suave'),R(3,[B('Umbral','time',480,'umbral'),B('Recuperación','time',120,'suave')]),B('Vuelta a la calma','time',480,'suave')]},
  {id:'r-10k',name:'Ritmo San Silvestre',note:'5 km clavando el ritmo objetivo del 10K.',steps:[B('Calentamiento','time',600,'suave'),B('Ritmo carrera','dist',5000,'carrera'),B('Vuelta a la calma','time',300,'suave')]},
  {id:'r-larga',name:'Tirada larga 8 km',note:'Volumen. Lento a propósito: aquí el objetivo es no pasarte de rápido.',steps:[B('Tirada larga','dist',8000,'suave')]}
];
const DEFAULT_SETTINGS={tol:3,grace:6,repeat:8,vol:0.7,voiceBlocks:true,voiceKm:true,alertVoice:false,sim:false,simSpeed:10,p5:347,autoZones:true};
// Todos los rangos salen del ritmo de 5K de referencia (desplazamientos en s/km)
const OFFS={suave:[63,103],carrera:[13,28],umbral:[8,23],series:[-22,-7]};
function deriveZones(p5){const z=clone(DEFAULT_ZONES);for(const k in OFFS){z[k].min=p5+OFFS[k][0];z[k].max=p5+OFFS[k][1]}return z}

let zones=Object.assign(clone(DEFAULT_ZONES),store.get('zones',{}));
let routines=store.get('routines',null)||clone(DEFAULT_ROUTINES);
let history=store.get('history',[]);
let settings=Object.assign({},DEFAULT_SETTINGS,store.get('settings',{}));
if(settings.autoZones)zones=deriveZones(settings.p5);
let plan=store.get('plan',null);
const savePlan=()=>store.set('plan',plan);
const LIBRE={name:'Libre',min:null,max:null};
const zoneOf=k=>k==='libre'?LIBRE:(zones[k]||LIBRE);

function flatten(steps){const out=[];for(const s of steps){if(s.type==='repeat'){for(let i=1;i<=s.n;i++)for(const b of s.blocks)out.push({...b,rep:`${i}/${s.n}`})}else out.push({...s})}return out}
function amountText(b,spoken){
  if(b.kind==='time'){const v=b.value,mi=spoken?' minutos':' min',se=spoken?' segundos':' s';
    if(v%60===0)return (v/60)+mi; if(v<60)return v+se; return Math.floor(v/60)+mi+' '+(v%60)+se}
  if(b.kind==='dist'){if(b.value>=1000&&b.value%100===0)return String(b.value/1000).replace('.',',')+(spoken?' kilómetros':' km');return b.value+(spoken?' metros':' m')}
  return 'sin final';
}
const zLow=k=>{const n=zoneOf(k).name;return n.charAt(0).toLowerCase()+n.slice(1)};
function stepsSummary(steps){return steps.map(s=>s.type==='repeat'?`${s.n} × (${s.blocks.map(b=>`${amountText(b)} ${zLow(b.zone)}`).join(' + ')})`:`${amountText(s)} ${zLow(s.zone)}`).join(' · ')}
function midPace(k){const z=zoneOf(k);return z.min!=null?(z.min+z.max)/2:(zones.suave.max+40)}
function estimate(steps){let t=0,d=0;for(const b of flatten(steps)){const p=midPace(b.zone);if(b.kind==='time'){t+=b.value;d+=b.value/p*1000}else if(b.kind==='dist'){d+=b.value;t+=b.value/1000*p}}return{t,d}}

/* ============ sonido y voz ============ */
let ac=null;
function audioInit(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tone(freq,dur,when=0,type='square'){
  if(!ac)return;const t=ac.currentTime+when+0.01;const o=ac.createOscillator(),g=ac.createGain();
  const v=Math.max(0.0002,settings.vol*0.5);o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.012);g.gain.setValueAtTime(v,t+dur-0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+0.03);
}
const CUES={
  fast(){tone(1400,.11);tone(1400,.11,.17);tone(1400,.11,.34)}, // tres agudos cortos: frena
  slow(){tone(300,.55,0,'sawtooth')},                          // grave largo: aprieta
  ok(){tone(880,.09,0,'triangle');tone(1320,.14,.11,'triangle')},
  block(){[0,.22,.44].forEach(w=>tone(1050,.14,w,'triangle'))},
  count(){tone(700,.09,0,'triangle')},
  go(){tone(1320,.45,0,'triangle')}
};
function cue(n){audioInit();CUES[n]&&CUES[n]()}
let esVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();esVoice=vs.find(v=>v.lang==='es-ES')||vs.find(v=>v.lang&&v.lang.startsWith('es'))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,urgent){
  if(!('speechSynthesis' in window))return;
  try{if(urgent)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';if(esVoice)u.voice=esVoice;u.rate=1.05;u.volume=Math.min(1,settings.vol+0.3);speechSynthesis.speak(u)}catch(e){}
}

/* ============ motor de carrera ============ */
const clock={sim:0,now(){return settings.sim?this.sim:Date.now()}};
let run=null,geoId=null,tickTimer=null,simTimer=null,sim=null,wl=null;

async function wakeOn(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
function wakeOff(){try{wl&&wl.release()}catch(e){}wl=null}
document.addEventListener('visibilitychange',()=>{if(run&&document.visibilityState==='visible')wakeOn()});
window.addEventListener('beforeunload',e=>{if(run&&run.phase==='running'){e.preventDefault();e.returnValue=''}});

function startRun(routine,planRef){
  audioInit();
  run={routine:{id:routine.id,name:routine.name},planRef:planRef||null,blocks:flatten(routine.steps),phase:'ready',bi:0,elapsed:0,dist:0,
    points:[],last:null,rejects:0,pace:null,acc:null,lastFixT:0,gpsError:null,state:'none',settling:false,
    outDir:null,outSince:null,lastAlert:0,alerted:false,inMs:0,rangeMs:0,bInMs:0,bRangeMs:0,
    samples:[],lastSampleE:-1e9,splits:[],lastSplitE:0,blockStart:{e:0,d:0},blockStats:[],countSaid:{},said100:false,
    paused:false,startedAt:null,lastTickT:null,endArm:0,ctrlKey:''};
  setView('run');
  wakeOn();
  if(settings.sim){
    clock.sim=Date.now();sim={lat:40.4380,lon:-3.8100,ph:Math.random()*6};
    simTimer=setInterval(simStep,1000/settings.simSpeed);simStep();
  }else if(!('geolocation' in navigator)){
    run.gpsError='Este navegador no da acceso al GPS.';updateRun();
  }else{
    geoId=navigator.geolocation.watchPosition(
      p=>onPos(p.coords.latitude,p.coords.longitude,p.coords.accuracy,Date.now()),
      e=>{if(!run)return;run.gpsError=e.code===1?'Permiso de ubicación denegado. Actívalo para esta web en los ajustes de Chrome y vuelve a entrar.':'Todavía no hay señal GPS. Sal a cielo abierto y espera unos segundos.';updateRun()},
      {enableHighAccuracy:true,maximumAge:0,timeout:20000});
    tickTimer=setInterval(tick,1000);
  }
}
function stopDrivers(){if(geoId!=null)navigator.geolocation.clearWatch(geoId);geoId=null;clearInterval(tickTimer);clearInterval(simTimer);tickTimer=simTimer=null}

function simStep(){
  clock.sim+=1000;if(!run)return;
  if(run.phase==='running'&&!run.paused){
    const b=run.blocks[run.bi]||run.blocks[run.blocks.length-1];
    const t=run.elapsed/1000;const p=midPace(b.zone)+24*Math.sin(t/40+sim.ph)+10*(Math.random()-.5);
    sim.lat+=(1000/p)/111320;
  }
  const n=()=>(Math.random()-.5)*2.4/111320;
  onPos(sim.lat+n(),sim.lon+n(),5+Math.random()*3,clock.now());
  tick();
}

function onPos(lat,lon,acc,t){
  if(!run)return;run.acc=acc;run.lastFixT=t;run.gpsError=null;
  if(run.phase!=='running'||run.paused){run.last=null;if(run.phase==='ready')updateRun();return}
  if(acc>35)return;
  const p={lat,lon,t};
  if(run.last){
    const d=hav(run.last,p),dt=(t-run.last.t)/1000;if(dt<=0)return;
    if(d/dt>9){if(++run.rejects<4)return;run.rejects=0;run.last=p;return}  // salto imposible: descartar
    run.rejects=0;
    if(d<Math.min(acc,12)*0.5&&dt<4)return;  // ruido estando casi parado
    run.dist+=d;
  }
  run.last=p;run.points.push({t,d:run.dist});
  while(run.points.length&&run.points[0].t<t-60000)run.points.shift();
}

// Ritmo suavizado: distancia recorrida en los últimos 20 s
function computePace(now){
  const pts=run.points;if(pts.length<2)return null;
  const last=pts[pts.length-1];if(now-last.t>8000)return null;
  let first=null;for(const p of pts){if(p.t>=now-20000){first=p;break}}
  if(!first||first===last)return null;
  const dt=(last.t-first.t)/1000,dd=last.d-first.d;
  if(dt<8||dd<12)return null;
  const pace=dt/(dd/1000);return pace>900?null:pace;
}

function blockProgress(){
  const b=run.blocks[run.bi];const be=run.elapsed-run.blockStart.e,bd=run.dist-run.blockStart.d;
  if(b.kind==='time')return{done:be>=b.value*1000,remaining:b.value*1000-be,frac:be/(b.value*1000),be,bd};
  if(b.kind==='dist')return{done:bd>=b.value,remaining:b.value-bd,frac:bd/b.value,be,bd};
  return{done:false,remaining:null,frac:0,be,bd};
}

function tick(){
  if(!run)return;const now=clock.now();
  if(run.phase!=='running'){updateRun();return}
  const dt=run.lastTickT==null?0:now-run.lastTickT;run.lastTickT=now;
  if(run.paused){updateRun();return}
  run.elapsed+=dt;
  const raw=computePace(now);
  run.pace=raw==null?null:(run.pace==null?raw:run.pace*0.5+raw*0.5);
  while(run.dist>=(run.splits.length+1)*1000){
    const sp=run.elapsed-run.lastSplitE;run.splits.push(Math.round(sp));run.lastSplitE=run.elapsed;
    if(settings.voiceKm)speak(`Kilómetro ${run.splits.length}. Lo has hecho a ${paceWords(sp/1000)}.`);
  }
  evalAlert(now,dt);
  if(run.elapsed-run.lastSampleE>=5000){run.samples.push([Math.round(run.elapsed/1000),Math.round(run.dist),run.pace==null?null:Math.round(run.pace),run.bi]);run.lastSampleE=run.elapsed}
  checkBlock();
  updateRun();
}

function evalAlert(now,dt){
  const b=run.blocks[run.bi],z=zoneOf(b.zone);
  run.settling=false;
  if(z.min==null){run.state='free';return}
  if(run.pace==null){run.state=now-run.lastFixT>8000?'nogps':'wait';run.outDir=null;run.outSince=null;return}
  const p=run.pace,tol=settings.tol;let s;
  if(p<z.min-tol)s='fast';else if(p>z.max+tol)s='slow';
  else if(p>=z.min&&p<=z.max)s='in';
  else s=(run.state==='fast'||run.state==='slow')?run.state:'in';  // histéresis en la franja de tolerancia
  const settling=(run.elapsed-run.blockStart.e)<20000;
  run.state=s;run.settling=settling;
  if(settling)return;
  run.rangeMs+=dt;run.bRangeMs+=dt;if(s==='in'){run.inMs+=dt;run.bInMs+=dt}
  if(s!=='in'){
    if(run.outDir!==s){run.outDir=s;run.outSince=now}
    if(now-run.outSince>=settings.grace*1000&&now-run.lastAlert>=settings.repeat*1000){
      cue(s);if(settings.alertVoice)speak(s==='fast'?'Más despacio':'Más rápido',true);
      run.lastAlert=now;run.alerted=true;
    }
  }else{run.outDir=null;run.outSince=null;if(run.alerted){cue('ok');run.alerted=false}}
}

function checkBlock(){
  const b=run.blocks[run.bi],pr=blockProgress();
  if(b.kind==='time'){const r=Math.ceil(pr.remaining/1000);if(r>=1&&r<=3&&!run.countSaid[r]){run.countSaid[r]=1;cue('count')}}
  if(b.kind==='dist'&&b.value>=300&&pr.remaining<=100&&!run.said100){run.said100=true;if(settings.voiceBlocks)speak('Últimos cien metros')}
  if(pr.done)nextBlock();
}
function closeBlock(){
  const pr=blockProgress(),b=run.blocks[run.bi];
  run.blockStats.push({label:b.label,rep:b.rep||'',zone:b.zone,ms:Math.round(pr.be),m:Math.round(pr.bd),inPct:run.bRangeMs>3000?Math.round(100*run.bInMs/run.bRangeMs):null});
}
function nextBlock(){
  closeBlock();run.bi++;
  Object.assign(run,{blockStart:{e:run.elapsed,d:run.dist},bInMs:0,bRangeMs:0,countSaid:{},said100:false,outDir:null,outSince:null,alerted:false,state:'none'});
  if(run.bi>=run.blocks.length){finishRun(false);return}
  cue('block');announceBlock();
}
function announceBlock(){
  if(!settings.voiceBlocks)return;const b=run.blocks[run.bi],z=zoneOf(b.zone);
  let t=`${b.label}${b.rep?', '+b.rep.replace('/',' de '):''}. ${b.kind==='open'?'':amountText(b,true)}`;
  t+=z.min!=null?`, entre ${paceWords(z.min)} y ${paceWords(z.max)}.`:', ritmo libre.';speak(t);
}
function beginCountdown(){
  audioInit();if(run.phase!=='ready')return;run.phase='countdown';run.cd=3;cue('count');updateRun();
  const iv=setInterval(()=>{if(!run){clearInterval(iv);return}run.cd--;
    if(run.cd>0){cue('count');updateRun()}
    else{clearInterval(iv);cue('go');Object.assign(run,{phase:'running',startedAt:Date.now(),lastTickT:clock.now(),last:null,points:[],blockStart:{e:0,d:0}});announceBlock();updateRun()}
  },1000);
}
function togglePause(){
  run.paused=!run.paused;
  if(!run.paused){run.last=null;run.points=[];run.pace=null;run.lastTickT=clock.now();run.outDir=null;run.outSince=null;speak('Seguimos',true)}
  else speak('Pausa',true);
  updateRun();
}
function finishRun(closeCurrent){
  if(!run)return;
  const started=run.phase==='running';
  if(closeCurrent&&started&&run.bi<run.blocks.length)closeBlock();
  stopDrivers();wakeOff();
  if(!started){run=null;setView('home');return}
  const used={};for(const b of run.blocks){const z=zoneOf(b.zone);if(z.min!=null)used[b.zone]=[z.min,z.max]}
  const rec={id:uid(),date:run.startedAt,name:run.routine.name,ms:Math.round(run.elapsed),m:Math.round(run.dist),
    inPct:run.rangeMs>5000?Math.round(100*run.inMs/run.rangeMs):null,splits:run.splits,blocks:run.blockStats,samples:run.samples,z:used,sim:settings.sim};
  // Cuánto del entrenamiento previsto se ha hecho (0–1)
  rec.completion=run.blocks.reduce((a,b,i)=>{const s=run.blockStats[i];if(!s)return a;
    return a+(b.kind==='time'?Math.min(1,s.ms/(b.value*1000)):b.kind==='dist'?Math.min(1,s.m/b.value):1)},0)/run.blocks.length;
  if(run.planRef&&plan){rec.plan=run.planRef;const w=plan.weeks[run.planRef.w],s=w&&w.sessions.find(x=>x.id===run.planRef.s);
    if(s&&rec.ms>=30000){s.rec=rec.id;s.done=rec.completion>=0.8;s.completion=rec.completion;savePlan()}}
  cue('block');
  if(settings.voiceBlocks)speak(`Entrenamiento terminado. ${fmtKm(rec.m)} kilómetros${rec.inPct!=null?`, ${rec.inPct} por ciento del tiempo en ritmo`:''}.`);
  run=null;
  if(rec.ms>=30000){history.unshift(rec);store.set('history',history)}
  setView('detail',rec.id,rec);
}

/* ============ vistas ============ */
let view='home',viewArg=null,draft=null;
const app=$('#app');
function setView(v,arg,extra){
  view=v;viewArg=arg;
  $('#tabbar').hidden=v==='run';
  app.classList.toggle('running',v==='run');
  const cur=v==='detail'?'history':v==='editor'?'home':v;
  for(const b of document.querySelectorAll('#tabbar button')){if(b.dataset.view===cur)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}
  render(extra);window.scrollTo(0,0);
}
function render(extra){
  if(view==='home')app.innerHTML=viewHome();
  else if(view==='history')app.innerHTML=viewHistory();
  else if(view==='settings')app.innerHTML=viewSettings();
  else if(view==='plan')app.innerHTML=viewPlan();
  else if(view==='editor')app.innerHTML=viewEditor();
  else if(view==='detail'){const rec=extra||history.find(h=>h.id===viewArg);app.innerHTML=rec?viewDetail(rec):viewHistory()}
  else if(view==='run'){app.innerHTML=viewRun();run.ctrlKey='';updateRun()}
}

function viewHome(){
  const chips=Object.entries(zones).map(([k,z])=>`<button class="chip" data-quick="${k}"><span>${esc(z.name)}</span><b>${fmtPace(z.min)}–${fmtPace(z.max)}</b></button>`).join('');
  const cards=routines.map(r=>{const e=estimate(r.steps);return `<article class="routine">
    <div><h3>${esc(r.name)}</h3><p class="r-steps">${esc(stepsSummary(r.steps))}</p>${r.note?`<p class="r-note">${esc(r.note)}</p>`:''}
    <p class="r-meta tab">≈ ${Math.round(e.t/60)} min · ≈ ${fmtKm(e.d,1)} km</p></div>
    <div class="r-actions"><button class="btn primary" data-start="${r.id}">Empezar</button><button class="btn sm" data-edit="${r.id}">Editar</button></div></article>`}).join('');
  return `<header class="top"><h1>Lie<em>bre</em></h1><p class="sub">Te avisa con sonidos cuando te sales del ritmo, para que no tengas que mirar el móvil.</p></header>
  ${todayCard()}
  ${settings.sim?`<p class="small"><span class="pill mid">Modo prueba activo</span> El GPS es simulado. Desactívalo en Ajustes antes de salir a correr.</p>`:''}
  <section><h2>Carrera libre</h2><p class="hint">Elige un ritmo y sal sin bloques. Termina cuando quieras.</p><div class="chips">${chips}</div></section>
  <section><div class="sec-head"><h2>Rutinas</h2><button class="btn sm" data-act="new">+ Nueva rutina</button></div><div class="list">${cards||'<p class="empty">No tienes rutinas. Crea una con «Nueva rutina».</p>'}</div></section>`;
}

function viewRun(){
  return `<div class="run" id="run" data-state="none">
    <div class="run-top"><div><div class="eyebrow" id="r-routine"></div><div class="blk" id="r-block"></div></div><div class="range" id="r-range"></div></div>
    <div class="overlay" id="r-overlay" hidden></div>
    <div id="r-live">
      <div class="pace-wrap"><div class="pace" id="r-pace" aria-live="off">–:––</div><div class="unit">MIN/KM · últimos 20 s</div><div class="status" id="r-status"></div></div>
    </div>
    <div class="gauge" id="r-gauge" aria-hidden="true"><div class="g-track"></div><div class="g-band" id="g-band"></div><div class="g-mark" id="g-mark"></div><div class="g-labels"><span>← más lento</span><span>más rápido →</span></div></div>
    <div class="blkprog"><div class="bp-row"><span class="bp-rem" id="r-rem"></span><span class="bp-lab" id="r-remlab"></span></div><div class="bar"><i id="r-bar"></i></div><div class="next" id="r-next"></div></div>
    <div class="totals"><div><span>Tiempo</span><b id="r-time">0:00</b></div><div><span>Km</span><b id="r-dist">0,00</b></div><div><span>Ritmo medio</span><b id="r-avg">–:––</b></div></div>
    <div class="controls" id="r-controls"></div>
  </div>`;
}
const STATUS={in:'En ritmo',fast:'Vas rápido · frena',slow:'Vas lento · aprieta',wait:'Calculando ritmo…',nogps:'Sin señal GPS',free:'Ritmo libre',none:''};
function updateRun(){
  if(!run||view!=='run'||!$('#run'))return;
  const b=run.blocks[Math.min(run.bi,run.blocks.length-1)],z=zoneOf(b.zone);
  const st=run.phase!=='running'?'none':run.paused?'paused':(run.settling&&run.state!=='in'?'none':run.state);
  $('#run').dataset.state=st;
  $('#r-routine').textContent=run.routine.name;
  $('#r-block').textContent=b.label+(b.rep?` ${b.rep}`:'');
  $('#r-range').innerHTML=z.min!=null?`<span>${esc(z.name)}</span><b>${fmtPace(z.min)}–${fmtPace(z.max)}</b>`:`<span>Libre</span><b>sin avisos</b>`;
  $('#r-pace').textContent=fmtPace(run.pace);
  let status=run.paused?'En pausa':STATUS[run.state]||'';
  if(run.phase==='running'&&!run.paused&&run.settling&&z.min!=null&&run.pace!=null)status=run.state==='in'?'En ritmo':'Ajustando ritmo…';
  $('#r-status').textContent=run.phase==='running'?status:'';
  // indicador
  const gauge=$('#r-gauge');gauge.hidden=z.min==null;
  if(z.min!=null){const c=(z.min+z.max)/2,hs=Math.max(45,(z.max-z.min)/2+30),x=p=>Math.min(100,Math.max(0,((c+hs)-p)/(2*hs)*100));
    const band=$('#g-band');band.style.left=x(z.max)+'%';band.style.width=(x(z.min)-x(z.max))+'%';
    const mk=$('#g-mark');mk.hidden=run.pace==null;if(run.pace!=null)mk.style.left=x(run.pace)+'%'}
  // bloque
  const pr=blockProgress();
  if(b.kind==='time'){$('#r-rem').textContent=fmtDur(Math.ceil(Math.max(0,pr.remaining)/1000)*1000);$('#r-remlab').textContent='quedan en este bloque'}
  else if(b.kind==='dist'){const r=Math.max(0,Math.ceil(pr.remaining));$('#r-rem').textContent=r>=1000?fmtKm(r)+' km':r+' m';$('#r-remlab').textContent='quedan en este bloque'}
  else{$('#r-rem').textContent=fmtDur(pr.be);$('#r-remlab').textContent='sin final · termina cuando quieras'}
  $('#r-bar').style.width=Math.min(100,pr.frac*100)+'%';
  const nb=run.blocks[run.bi+1];
  $('#r-next').textContent=nb?`Después: ${nb.label}${nb.rep?' '+nb.rep:''} · ${amountText(nb)} ${zLow(nb.zone)}`:(b.kind==='open'?'':'Último bloque');
  $('#r-time').textContent=fmtDur(run.elapsed);
  $('#r-dist').textContent=fmtKm(run.dist);
  $('#r-avg').textContent=run.dist>50?fmtPace(run.elapsed/1000/(run.dist/1000)):'–:––';
  // panel de preparación
  const ov=$('#r-overlay'),live=$('#r-live');
  if(run.phase==='ready'){
    const a=run.acc,q=a==null?'':a<=12?'ok':a<=25?'mid':'';
    ov.hidden=false;live.hidden=true;
    ov.innerHTML=`<h3>Preparado</h3>
      <div class="gps"><i class="dot ${q}"></i>${a==null?'Buscando GPS…':`GPS: precisión ±${Math.round(a)} m`}</div>
      ${run.gpsError?`<p class="err">${esc(run.gpsError)}</p>`:''}
      <p>Espera a que la precisión baje de 20 m. Durante la carrera deja la pantalla encendida y Chrome en primer plano: con la pantalla apagada el móvil deja de enviar el GPS a la app.</p>
      <p>Sonidos: <b>tres pitidos agudos</b> = vas rápido, frena. <b>Un tono grave largo</b> = vas lento, aprieta. <b>Dos notas que suben</b> = has vuelto al ritmo.</p>`;
  }else if(run.phase==='countdown'){ov.hidden=false;live.hidden=true;ov.innerHTML=`<div class="cd tab">${run.cd}</div>`}
  else{ov.hidden=true;live.hidden=false;if(run.gpsError&&!run.paused){$('#r-status').textContent=run.gpsError}}
  // controles
  const key=run.phase+'|'+run.paused+'|'+(Date.now()<run.endArm)+'|'+(run.acc!=null&&run.acc<=20);
  if(key!==run.ctrlKey){run.ctrlKey=key;const c=$('#r-controls');
    if(run.phase==='ready')c.innerHTML=`<button class="btn" data-run="cancel">Cancelar</button><button class="btn primary" data-run="go">${run.acc!=null&&run.acc<=20?'Empezar':'Empezar igualmente'}</button>`;
    else if(run.phase==='countdown')c.innerHTML=`<button class="btn" data-run="cancel">Cancelar</button>`;
    else c.innerHTML=`<button class="btn" data-run="pause">${run.paused?'Reanudar':'Pausar'}</button><button class="btn" data-run="skip">Saltar</button><button class="btn ${Date.now()<run.endArm?'danger':''}" data-run="end">${Date.now()<run.endArm?'¿Seguro? Toca':'Terminar'}</button>`}
}

function chartSvg(rec){
  const pts=rec.samples.filter(s=>s[2]!=null);if(pts.length<2)return '<p class="small" style="padding:8px">No hay suficientes datos de ritmo para dibujar la gráfica.</p>';
  const W=640,H=280,L=66,Rr=12,T=12,Bt=36,T1=rec.samples[rec.samples.length-1][0]||1;
  const bands=[];let acc=0;for(const b of rec.blocks){const s=acc/1000;acc+=b.ms;const r=rec.z&&rec.z[b.zone];if(r)bands.push([s,acc/1000,r[0],r[1]])}
  let lo=Math.min(...pts.map(p=>p[2]),...bands.map(b=>b[2]))-15,hi=Math.max(...pts.map(p=>p[2]),...bands.map(b=>b[3]))+15;
  lo=Math.floor(lo/30)*30;hi=Math.ceil(hi/30)*30;if(hi-lo<60)hi=lo+60;
  const X=t=>L+(t/T1)*(W-L-Rr),Y=p=>T+(p-lo)/(hi-lo)*(H-T-Bt); // más rápido arriba
  let g='';for(let p=lo;p<=hi;p+=30)g+=`<line class="ch-grid" x1="${L}" x2="${W-Rr}" y1="${Y(p)}" y2="${Y(p)}"/><text class="ch-txt" x="${L-6}" y="${Y(p)+4}" text-anchor="end">${fmtPace(p)}</text>`;
  const step=T1>3000?600:T1>1200?300:T1>400?120:60;
  for(let t=0;t<=T1;t+=step)g+=`<text class="ch-txt" x="${X(t)}" y="${H-6}" text-anchor="middle">${Math.round(t/60)}′</text>`;
  const bd=bands.map(b=>`<rect class="ch-band" x="${X(b[0])}" width="${Math.max(0,X(b[1])-X(b[0]))}" y="${Y(b[2])}" height="${Math.max(2,Y(b[3])-Y(b[2]))}"/>`).join('');
  let d='',pen=false;for(const s of rec.samples){if(s[2]==null){pen=false;continue}const yp=Math.min(hi,Math.max(lo,s[2]));d+=(pen?'L':'M')+X(s[0]).toFixed(1)+' '+Y(yp).toFixed(1);pen=true}
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ritmo a lo largo del entrenamiento con el rango objetivo de cada bloque">${g}${bd}<path class="ch-line" d="${d}"/></svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>Tu ritmo</span><span><i style="background:var(--in);opacity:.35"></i>Rango objetivo</span><span>Arriba = más rápido</span></div>`;
}

/* ============ plan semanal adaptativo ============ */
const DAY=864e5,WD=['L','M','X','J','V','S','D'],WDL=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const todayKey=()=>dkey(new Date());
const wdOf=k=>(parseKey(k).getDay()+6)%7;
const daysBetween=(a,b)=>Math.round((b-a)/DAY);
const shortDate=d=>d.toLocaleDateString('es-ES',{day:'numeric',month:'short'}).replace('.','');
const RPE=['','Muy fácil','Fácil','Exigente','Duro','Al límite'];
const KIND={build:'Construcción',test:'Descarga y test',deload:'Descarga',taper:'Afinado',race:'Semana de carrera'};
const QUALITY=new Set(['series','umbral','carrera']);

function nWeeks(){return Math.floor(daysBetween(parseKey(plan.start),mondayOf(parseKey(plan.raceDate)))/7)+1}
function curIdx(){return Math.floor(daysBetween(parseKey(plan.start),mondayOf(new Date()))/7)}
function weekKind(i,N){if(i===N-1)return 'race';if(i===N-2&&N>=4)return 'taper';if(i%4===3&&i<N-2)return i===3?'test':'deload';return 'build'}

// Progresión por nivel: cada semana superada sube un escalón
const SER=[[6,400,90],[8,400,90],[5,600,120],[6,600,120],[5,800,120],[6,800,120],[7,800,120]];
const UMB=[[3,360,120],[3,480,120],[3,600,120],[2,900,180],[3,720,150],[2,1200,180]];
const PACE=[2000,3000,4000,5000,6000,7000];
const EASY=[25,30,35,40,40,45];
const LONG=[6,7,8,9,10,11,12];
const at=(a,L)=>a[Math.max(0,Math.min(L,a.length-1))];
const WU=()=>B('Calentamiento','time',600,'suave'),CD=(s=480)=>B('Vuelta a la calma','time',s,'suave');
const SESSION={
  series:L=>{const[n,m,r]=at(SER,L);return{title:`Series ${n}×${m} m`,note:'Velocidad. Recupera trotando muy suave o andando.',steps:[WU(),R(n,[B('Serie','dist',m,'series'),B('Recuperación','time',r,'libre')]),CD()]}},
  umbral:L=>{const[n,s,r]=at(UMB,L);return{title:`Umbral ${n}×${s/60} min`,note:'Exigente pero controlado: frases cortas, no conversación.',steps:[WU(),R(n,[B('Umbral','time',s,'umbral'),B('Recuperación','time',r,'suave')]),CD()]}},
  pace:L=>{const d=at(PACE,L);return{title:`Ritmo carrera ${d/1000} km`,note:'Clavar el ritmo objetivo del día de la carrera.',steps:[WU(),B('Ritmo carrera','dist',d,'carrera'),CD(300)]}},
  easy:L=>{const m=at(EASY,L);return{title:`Rodaje ${m} min`,note:'Suave de verdad: tienes que poder hablar.',steps:[B('Rodaje','time',m*60,'suave')]}},
  long:(L,kind)=>{let km=at(LONG,L);if(kind!=='build')km=Math.max(5,Math.round(km*0.75));return{title:`Tirada larga ${km} km`,note:'Volumen. Lento a propósito.',steps:[B('Tirada larga','dist',km*1000,'suave')]}},
  test:()=>({title:'Test 5 km',note:'A tope pero regular desde el principio. El resultado recalcula todos tus ritmos.',steps:[WU(),B('Test 5 km','dist',5000,'libre'),CD(300)]}),
  easyShort:()=>({title:'Rodaje 25 min',note:'Soltar piernas. Nada de apretar esta semana.',steps:[B('Rodaje','time',1500,'suave')]}),
  activation:()=>({title:'Activación',note:'Recordar el ritmo de carrera sin cansarte.',steps:[B('Rodaje','time',900,'suave'),B('Ritmo carrera','dist',2000,'carrera'),CD(300)]}),
  race:()=>({title:plan.goalName,note:'Sal a ritmo, no más rápido. Los primeros km con gente engañan.',steps:[B('Carrera','dist',10000,'carrera')]})
};

function genWeek(i,level){
  const N=nWeeks(),kind=weekKind(i,N),start=addDays(parseKey(plan.start),7*i);
  const L=kind==='build'?level:Math.max(0,level-1);
  const days=[...plan.days].sort((a,b)=>a-b),longDay=days.includes(plan.longDay)?plan.longDay:days[days.length-1];
  const mk=(wd,type)=>{const s=type==='long'?SESSION.long(L,kind):SESSION[type](L);return{id:uid(),date:dkey(addDays(start,wd)),type,...s,done:false}};
  const sessions=[];
  if(kind==='race'){
    const raceWd=wdOf(plan.raceDate),before=days.filter(d=>d<raceWd&&d!==raceWd-1).slice(-2);
    before.forEach((d,j)=>sessions.push(mk(d,j===before.length-1&&before.length===2?'activation':'easyShort')));
    sessions.push({id:uid(),date:plan.raceDate,type:'race',...SESSION.race(),done:false});
  }else{
    const others=days.filter(d=>d!==longDay);
    const Q=kind==='test'?'test':(i%2===0?'series':'umbral');
    const E2=(i>=2&&i%2===1&&kind==='build')?'pace':'easy';
    const tmpl=[[],[Q],[Q,E2],[Q,'easy','pace'],[Q,'easy','pace','easy']][Math.min(4,others.length)];
    others.slice(0,tmpl.length).forEach((d,j)=>sessions.push(mk(d,tmpl[j])));
    sessions.push(mk(longDay,'long'));
    sessions.sort((a,b)=>a.date<b.date?-1:1);
  }
  return{i,start:dkey(start),kind,level:L,sessions};
}
function evaluateWeek(i){
  const w=plan.weeks[i];if(!w||w.evaluated)return;w.evaluated=true;
  const ss=w.sessions.filter(s=>s.type!=='race');if(!ss.length)return;
  const done=ss.filter(s=>s.done),rp=done.map(s=>s.rpe).filter(Boolean);
  const ratio=done.length/ss.length,rpe=rp.length?rp.reduce((a,b)=>a+b,0)/rp.length:3;
  let delta=0,why;
  if(w.kind!=='build')why='era semana de descarga, mantenemos el nivel';
  else if(ratio>=0.66&&rpe<=3.6){delta=1;why='subimos un escalón'}
  else if(ratio<0.5||rpe>=4.5){delta=plan.level>0?-1:0;why=delta?'bajamos un escalón para que asimiles':'mantenemos el nivel inicial'}
  else why='repetimos nivel para consolidar';
  plan.level=Math.max(0,plan.level+delta);
  w.evalNote=`Semana ${i+1}: ${done.length} de ${ss.length} sesiones hechas${rp.length?`, esfuerzo medio ${rpe.toFixed(1).replace('.',',')}`:''}. Por eso ${why}.`;
  plan.log.unshift({date:todayKey(),text:w.evalNote});
}
function syncPlan(){
  if(!plan)return;const N=nWeeks(),ci=Math.min(Math.max(curIdx(),0),N-1);
  let changed=false;
  while(plan.weeks.length<=ci){const i=plan.weeks.length;if(i>0)evaluateWeek(i-1);plan.weeks.push(genWeek(i,plan.level));changed=true}
  if(curIdx()>=N&&plan.weeks[N-1]&&!plan.weeks[N-1].evaluated){plan.weeks[N-1].evaluated=true;changed=true}
  if(changed)savePlan();
}
function previewWeek(i){const N=nWeeks();let lv=plan.level;for(let j=plan.weeks.length-1;j<i;j++)if(j>=0&&weekKind(j,N)==='build')lv++;return genWeek(i,lv)}
function weekAt(i){return plan.weeks[i]||previewWeek(i)}
function sessStatus(s){const t=todayKey();return s.done?'done':s.date<t?'missed':s.date===t?'today':'future'}
const weekKm=w=>w.sessions.reduce((a,s)=>a+estimate(s.steps).d,0);

// Tras valorar el esfuerzo: marcar la sesión y corregir el ritmo de referencia
function applyRpe(rec,rpe){
  rec.rpe=rpe;store.set('history',history);
  if(!rec.plan||!plan)return;
  const w=plan.weeks[rec.plan.w],s=w&&w.sessions.find(x=>x.id===rec.plan.s);if(!s)return;
  s.rpe=rpe;const old=settings.p5;let msg=null;
  if(s.type==='test'){
    const tb=rec.blocks.find(b=>b.label==='Test 5 km');
    if(tb&&tb.m>=4750){const np=Math.round(tb.ms/tb.m);settings.p5=Math.max(old-30,Math.min(old+30,np));
      msg=`Test 5 km a ${fmtPace(np)}/km. Ritmo de referencia ${fmtPace(old)} → ${fmtPace(settings.p5)}.`}
  }else if(['series','umbral','pace','activation','race'].includes(s.type)){
    const work=rec.blocks.filter(b=>QUALITY.has(b.zone)&&b.m>50);
    const ms=work.reduce((a,b)=>a+b.ms,0),m=work.reduce((a,b)=>a+b.m,0);
    const zr=work.length&&rec.z[work[0].zone];
    if(m>300&&zr){
      const avg=ms/m,mid=(zr[0]+zr[1])/2;
      const wIn=work.filter(b=>b.inPct!=null),inP=wIn.length?wIn.reduce((a,b)=>a+b.inPct*b.ms,0)/wIn.reduce((a,b)=>a+b.ms,0):0;
      if(rec.completion>=0.9&&inP>=65&&rpe<=3&&avg<=mid){settings.p5=old-3;msg=`${s.title}: completa, ${Math.round(inP)}% en rango y esfuerzo ${RPE[rpe].toLowerCase()}. Ritmos 3 s/km más rápidos.`}
      else if(rec.completion<0.75||rpe>=5||avg>zr[1]+5){settings.p5=old+3;msg=`${s.title}: ${rec.completion<0.75?'incompleta':rpe>=5?'al límite':'por debajo del rango'}. Ritmos 3 s/km más lentos.`}
    }
  }
  if(settings.p5!==old){store.set('settings',settings);if(settings.autoZones){zones=deriveZones(settings.p5);store.set('zones',zones)}}
  if(msg)plan.log.unshift({date:todayKey(),text:msg});
  savePlan();toast(msg?'Plan ajustado':'Esfuerzo guardado');
}

let planDraft=null,delPlanArm=false;
function newDraft(){return plan?{goalName:plan.goalName,raceDate:plan.raceDate,days:[...plan.days],longDay:plan.longDay,p5:settings.p5}:{goalName:'San Silvestre Vallecana',raceDate:'2026-12-31',days:[1,3,6],longDay:6,p5:settings.p5}}
function viewPlanSetup(){
  const d=planDraft||(planDraft=newDraft());
  return `<header class="top"><h1>${plan?'Cambiar plan':'Tu plan'}</h1><p class="sub">Un calendario semana a semana hasta tu carrera. Cada semana se ajusta a lo que completes y a cómo te sienten las sesiones.</p></header>
  <section class="card">
    <div class="field"><label for="pd-name">Objetivo</label><input class="in" id="pd-name" data-pd="goalName" value="${esc(d.goalName)}"></div>
    <div class="field"><label for="pd-date">Fecha de la carrera</label><input class="in" type="date" id="pd-date" data-pd="raceDate" value="${esc(d.raceDate)}"></div>
    <div class="field"><span class="lbl">Días que puedes correr</span><div class="days">${WD.map((l,i)=>`<button class="daychip" data-day="${i}" aria-pressed="${d.days.includes(i)}" aria-label="${WDL[i]}">${l}</button>`).join('')}</div><p class="small">Entre 2 y 5. Mejor que no sean seguidos.</p></div>
    <div class="field"><label for="pd-long">Día de la tirada larga</label><select class="in" id="pd-long" data-pd="longDay">${[...d.days].sort((a,b)=>a-b).map(i=>`<option value="${i}" ${i===d.longDay?'selected':''}>${WDL[i]}</option>`).join('')}</select></div>
    <div class="field"><label for="pd-p5">Tu ritmo actual en 5 km (min/km)</label><input class="in num" id="pd-p5" data-pd="p5" value="${typeof d.p5==='number'?fmtPace(d.p5):esc(d.p5)}" inputmode="decimal" style="max-width:120px"><p class="small">De aquí salen todos tus rangos. El plan lo irá corrigiendo con lo que hagas.</p></div>
  </section>
  <div class="row"><button class="btn primary" style="flex:1" data-act="save-plan">${plan?'Guardar cambios':'Crear plan'}</button>${plan?'<button class="btn" data-act="cancel-plan">Cancelar</button>':''}</div>`;
}
function sessRow(s,wi,canStart){
  const d=parseKey(s.date),st=sessStatus(s),e=estimate(s.steps);
  return `<div class="sess ${st}"><div class="s-date"><b>${WDL[wdOf(s.date)]}</b><span>${d.getDate()}</span></div>
    <div class="s-main"><b>${esc(s.title)}</b><span>${esc(stepsSummary(s.steps))}</span><span class="tab">≈ ${Math.round(e.t/60)} min · ≈ ${fmtKm(e.d,1)} km</span></div>
    <div class="s-act">${st==='done'?`<button class="btn sm" data-open="${s.rec}">Hecho · ${s.rpe?RPE[s.rpe].toLowerCase():'ver'}</button>`:st==='missed'?'<span class="pill bad">No hecho</span>':''}
    ${canStart&&st!=='done'?`<button class="btn sm ${st==='today'?'primary':''}" data-psess="${wi}:${s.id}">${s.rec?'Repetir':'Empezar'}</button>`:''}</div></div>`;
}
function calGrid(N,ci){
  const t=todayKey();let h='<div class="cal"><span></span>'+WD.map(l=>`<span class="h">${l}</span>`).join('');
  for(let i=0;i<N;i++){const w=weekAt(i),st=parseKey(w.start);h+=`<span class="wk ${i===ci?'cur':''}">S${i+1}</span>`;
    for(let d=0;d<7;d++){const k=dkey(addDays(st,d)),s=w.sessions.find(x=>x.date===k);
      const c=!s?'':s.type==='race'?'race':s.done?'done':k<t?'missed':'plan';
      h+=`<span class="cell ${c} ${k===t?'now':''}" title="${s?esc(s.title):''}">${addDays(st,d).getDate()}</span>`}}
  return h+`</div><div class="legend2"><span><i style="background:var(--in)"></i>Hecho</span><span><i style="border:1.5px solid var(--muted)"></i>Previsto</span><span><i style="background:var(--fast-soft);border:1.5px solid var(--fast)"></i>No hecho</span><span><i style="background:var(--accent)"></i>Carrera</span></div>`;
}
function viewPlan(){
  if(!plan||planDraft)return viewPlanSetup();
  syncPlan();
  const N=nWeeks(),raw=curIdx(),ci=Math.min(Math.max(raw,0),N-1),t=todayKey(),w=plan.weeks[ci];
  const left=daysBetween(parseKey(t),parseKey(plan.raceDate));
  const sub=raw<0?`Empieza el lunes ${shortDate(parseKey(plan.start))} · ${N} semanas`:left>0?`Faltan ${left} días · semana ${ci+1} de ${N}`:left===0?'Hoy es el día':'Carrera hecha. Crea un plan nuevo cuando quieras.';
  const z=k=>`${zones[k].name} <b>${fmtPace(zones[k].min)}–${fmtPace(zones[k].max)}</b>`;
  const rows=[];const st=parseKey(w.start);
  for(let d=0;d<7;d++){const k=dkey(addDays(st,d)),s=w.sessions.find(x=>x.date===k);
    rows.push(s?sessRow(s,ci,true):`<div class="sess rest"><div class="s-date"><b>${WDL[d]}</b><span>${addDays(st,d).getDate()}</span></div><div class="s-main"><span>Descanso</span></div></div>`)}
  const prev=plan.weeks[ci-1];
  const fut=[];for(let i=ci+1;i<N;i++){const fw=weekAt(i),s0=parseKey(fw.start);
    fut.push(`<details class="fut"><summary><b>Semana ${i+1} · ${KIND[fw.kind]}</b><span>${shortDate(s0)} · ≈ ${fmtKm(weekKm(fw),0)} km</span></summary><ul>${fw.sessions.map(s=>`<li>${WDL[wdOf(s.date)]} ${parseKey(s.date).getDate()}: ${esc(s.title)}</li>`).join('')}</ul></details>`)}
  return `<header class="top"><h1>${esc(plan.goalName)}</h1><p class="sub tab">${sub}</p></header>
  <section class="card"><div class="sec-head" style="margin:0"><h2>Tus ritmos</h2><span class="pill">5K ${fmtPace(settings.p5)}</span></div>
    <div class="refline">${['suave','carrera','umbral','series'].map(z).join('<span>·</span>')}</div>
    <p class="small">${settings.autoZones?'Se recalculan solos tras las sesiones de calidad y el test.':'Ajuste automático desactivado en Ajustes.'}</p></section>
  <section><h2 style="margin-bottom:12px">Calendario</h2>${calGrid(N,raw>=0?ci:-1)}</section>
  <section><div class="sec-head"><h2>Semana ${ci+1} · ${KIND[w.kind]}</h2></div>
    ${prev&&prev.evalNote?`<p class="note-box">${esc(prev.evalNote)}</p>`:''}
    <div class="wkcard">${rows.join('')}</div></section>
  ${fut.length?`<section><h2>Próximas semanas</h2><p class="hint">Provisional: cambia según cómo te vayan las anteriores.</p>${fut.join('')}</section>`:''}
  ${plan.log.length?`<section><h2 style="margin-bottom:12px">Ajustes del plan</h2><ul class="log">${plan.log.slice(0,8).map(l=>`<li><span>${shortDate(parseKey(l.date))}</span>${esc(l.text)}</li>`).join('')}</ul></section>`:''}
  <div class="row"><button class="btn sm" data-act="edit-plan">Cambiar días o fecha</button><button class="btn sm danger" data-act="del-plan">${delPlanArm?'Toca otra vez para borrar':'Borrar plan'}</button></div>`;
}
function todayCard(){
  if(!plan)return `<section class="today"><h3>Plan hasta tu carrera</h3><p class="small">Dime qué días puedes correr y te preparo cada semana, ajustada a cómo vayas.</p><button class="btn primary" data-view="plan">Crear plan</button></section>`;
  syncPlan();const t=todayKey(),N=nWeeks(),ci=Math.min(Math.max(curIdx(),0),N-1),w=plan.weeks[ci];
  const s=w.sessions.find(x=>x.date===t);
  if(s){const e=estimate(s.steps);return `<section class="today"><span class="eyebrow">Hoy toca</span><h3>${esc(s.title)}</h3><p class="small">${esc(s.note)} ≈ ${Math.round(e.t/60)} min.</p>
    ${s.done?`<button class="btn" data-open="${s.rec}">Hecho · ver resultado</button>`:`<button class="btn primary" data-psess="${ci}:${s.id}">Empezar</button>`}</section>`}
  let nx=null;for(let i=ci;i<N&&!nx;i++)nx=weekAt(i).sessions.find(x=>x.date>t);
  return `<section class="today"><span class="eyebrow">Hoy descansas</span>${nx?`<p style="margin:0">Próxima sesión: <b>${WDL[wdOf(nx.date)]} ${parseKey(nx.date).getDate()}</b> · ${esc(nx.title)}</p>`:''}<button class="btn sm" data-view="plan" style="align-self:flex-start">Ver plan</button></section>`;
}

function savePlanDraft(){
  const d=planDraft,p5=typeof d.p5==='number'?d.p5:parsePace(d.p5);
  if(p5==null||p5<200||p5>600){toast('Escribe tu ritmo de 5 km como 5:47');return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.raceDate)||daysBetween(parseKey(todayKey()),parseKey(d.raceDate))<7){toast('La carrera tiene que ser dentro de al menos una semana');return}
  const days=[...d.days].sort((a,b)=>a-b),longDay=days.includes(+d.longDay)?+d.longDay:days[days.length-1];
  if(p5!==settings.p5){settings.p5=p5;store.set('settings',settings);if(settings.autoZones){zones=deriveZones(p5);store.set('zones',zones)}}
  if(!plan){
    plan={goalName:d.goalName.trim()||'Mi carrera',raceDate:d.raceDate,start:dkey(mondayOf(addDays(new Date(),1))),days,longDay,level:0,weeks:[],
      log:[{date:todayKey(),text:`Plan creado con ritmo de referencia ${fmtPace(p5)}/km en 5 km.`}]};
  }else{
    const ci=Math.max(0,curIdx()),old=plan.weeks[ci];
    Object.assign(plan,{goalName:d.goalName.trim()||plan.goalName,raceDate:d.raceDate,days,longDay});
    plan.weeks=plan.weeks.slice(0,ci);syncPlan();
    const nw=plan.weeks[ci];if(old&&nw)for(const s of old.sessions)if(s.rec){const m=nw.sessions.find(x=>x.date===s.date);if(m)Object.assign(m,{done:s.done,rec:s.rec,rpe:s.rpe,completion:s.completion});else nw.sessions.push(s)}
    if(nw)nw.sessions.sort((a,b)=>a.date<b.date?-1:1);
    plan.log.unshift({date:todayKey(),text:`Plan modificado: ${days.map(x=>WDL[x]).join(', ')}, tirada larga el ${WDL[longDay].toLowerCase()}.`});
  }
  syncPlan();savePlan();planDraft=null;setView('plan');toast('Plan listo');
}

/* ============ eventos ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const ds=t.dataset;
  if(ds.view){delArm=null;resetArm=false;delPlanArm=false;if(ds.view!=='plan')planDraft=null;setView(ds.view);return}
  if(ds.psess){const[wi,sid]=ds.psess.split(':');const s=plan.weeks[+wi].sessions.find(x=>x.id===sid);if(s)startRun({id:'plan-'+s.id,name:s.title,steps:s.steps},{w:+wi,s:s.id});return}
  if(ds.rpe){const rec=history.find(h=>h.id===ds.rec);if(rec){applyRpe(rec,+ds.rpe);render()}return}
  if(ds.day!=null){const d=+ds.day,arr=planDraft.days;const i=arr.indexOf(d);if(i>=0){if(arr.length<=2){toast('Mínimo 2 días');return}arr.splice(i,1)}else{if(arr.length>=5){toast('Máximo 5 días');return}arr.push(d)}
    if(!arr.includes(planDraft.longDay))planDraft.longDay=[...arr].sort((a,b)=>a-b).pop();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(ds.quick){const z=zones[ds.quick];startRun({id:'libre-'+ds.quick,name:'Carrera libre · '+z.name,steps:[B(z.name,'open',0,ds.quick)]});return}
  if(ds.start){const r=routines.find(x=>x.id===ds.start);if(r)startRun(r);return}
  if(ds.edit){const r=routines.find(x=>x.id===ds.edit);draft=clone(r);delRoutineArm=false;setView('editor');return}
  if(ds.open){delArm=null;setView('detail',ds.open);return}
  if(ds.test){cue(ds.test);return}
  if(ds.run){
    if(ds.run==='go')beginCountdown();
    else if(ds.run==='cancel'){stopDrivers();wakeOff();run=null;setView('home')}
    else if(ds.run==='pause')togglePause();
    else if(ds.run==='skip'){if(run.phase==='running'){if(run.bi>=run.blocks.length-1)finishRun(true);else nextBlock()}}
    else if(ds.run==='end'){if(Date.now()<run.endArm)finishRun(true);else{run.endArm=Date.now()+3000;updateRun();setTimeout(()=>run&&updateRun(),3100)}}
    return;
  }
  if(ds.delrun){if(delArm===ds.delrun){history=history.filter(h=>h.id!==ds.delrun);store.set('history',history);delArm=null;toast('Entrenamiento borrado');setView('history')}else{delArm=ds.delrun;render()}return}
  if(ds.del!=null){const p=ds.del.split('.').map(Number);if(p.length===1)draft.steps.splice(p[0],1);else{draft.steps[p[0]].blocks.splice(p[1],1);if(!draft.steps[p[0]].blocks.length)draft.steps.splice(p[0],1)}rerenderEditor();return}
  if(ds.rep!=null){const s=draft.steps[+ds.rep];s.n=Math.max(1,Math.min(50,s.n+ +ds.dir));rerenderEditor();return}
  if(ds.addin!=null){draft.steps[+ds.addin].blocks.push(B('Bloque','time',60,'suave'));rerenderEditor();return}
  switch(ds.act){
    case 'history':delArm=null;setView('history');break;
    case 'edit-plan':planDraft=newDraft();setView('plan');break;
    case 'cancel-plan':planDraft=null;setView('plan');break;
    case 'del-plan':if(delPlanArm){plan=null;store.set('plan',null);delPlanArm=false;planDraft=null;toast('Plan borrado')}else delPlanArm=true;render();break;
    case 'save-plan':savePlanDraft();break;
    case 'new':draft={id:'r-'+uid(),name:'Mi rutina',note:'',isNew:true,steps:[B('Calentamiento','time',600,'suave')]};setView('editor');break;
    case 'add-block':draft.steps.push(B('Bloque','time',600,'suave'));rerenderEditor();break;
    case 'add-repeat':draft.steps.push(R(4,[B('Serie','dist',400,'series'),B('Recuperación','time',90,'libre')]));rerenderEditor();break;
    case 'cancel-edit':draft=null;setView('home');break;
    case 'save-edit':{
      if(document.querySelector('.ed-block .bad')){toast('Revisa las cantidades marcadas en rojo');break}
      if(!draft.steps.length){toast('Añade al menos un bloque');break}
      const r=clone(draft);delete r.isNew;r.name=r.name.trim()||'Mi rutina';
      const i=routines.findIndex(x=>x.id===r.id);if(i>=0)routines[i]=r;else routines.push(r);
      store.set('routines',routines);draft=null;toast('Rutina guardada');setView('home');break}
    case 'del-routine':if(delRoutineArm){routines=routines.filter(x=>x.id!==draft.id);store.set('routines',routines);draft=null;toast('Rutina borrada');setView('home')}else{delRoutineArm=true;rerenderEditor()}break;
    case 'reset-zones':zones=clone(DEFAULT_ZONES);store.set('zones',zones);toast('Ritmos restaurados');render();break;
    case 'reset-routines':if(resetArm){routines=clone(DEFAULT_ROUTINES);store.set('routines',routines);resetArm=false;toast('Rutinas restauradas')}else resetArm=true;render();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.set){const id=t.dataset.set;settings[id]=parseFloat(t.value);store.set('settings',settings);const o=$('#o-'+id);if(o)o.textContent=id==='vol'?Math.round(settings.vol*100)+'%':settings[id]+t.dataset.unit;return}
  if(t.dataset.meta&&draft){draft[t.dataset.meta]=t.value;return}
  if(t.dataset.pd&&planDraft&&t.tagName==='INPUT'){planDraft[t.dataset.pd]=t.value;return}
  if(t.dataset.f==='label'&&draft){stepAt(t.closest('.ed-block').dataset.path).label=t.value;return}
  if(t.dataset.f==='amount'&&draft){readAmount(t.closest('.ed-block').dataset.path);return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.tog){settings[t.dataset.tog]=t.checked;store.set('settings',settings);if(t.dataset.tog==='autoZones'){if(t.checked){zones=deriveZones(settings.p5);store.set('zones',zones)}render()}return}
  if(t.dataset.p5){const v=parsePace(t.value);if(v==null||v<200||v>600){t.classList.add('bad');toast('Escribe el ritmo como 5:47');return}
    t.classList.remove('bad');settings.p5=v;store.set('settings',settings);if(settings.autoZones){zones=deriveZones(v);store.set('zones',zones)}if(plan){plan.log.unshift({date:todayKey(),text:`Referencia cambiada a mano: ${fmtPace(v)}/km.`});savePlan()}render();toast('Ritmos actualizados');return}
  if(t.dataset.pd&&planDraft){const k=t.dataset.pd;planDraft[k]=k==='longDay'?+t.value:t.value;return}
  if(t.dataset.f==='unit'&&draft){readAmount(t.closest('.ed-block').dataset.path);return}
  if(t.dataset.f==='zone'&&draft){stepAt(t.closest('.ed-block').dataset.path).zone=t.value;const e2=estimate(draft.steps);const sub=$('.top .sub');if(sub)sub.textContent=`≈ ${Math.round(e2.t/60)} min · ≈ ${fmtKm(e2.d,1)} km`;return}
  if(t.dataset.zone){
    const k=t.dataset.zone,v=parsePace(t.value),z=zones[k];
    const other=t.dataset.end==='min'?z.max:z.min;
    const ok=v!=null&&v>=150&&v<=1200&&(t.dataset.end==='min'?v<other:v>other);
    if(!ok){t.classList.add('bad');toast('Escribe el ritmo como 6:30, y el primero más rápido que el segundo');return}
    t.classList.remove('bad');z[t.dataset.end]=v;t.value=fmtPace(v);store.set('zones',zones);toast(`${z.name}: ${fmtPace(z.min)}–${fmtPace(z.max)}`);
  }
});

setView('home');
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
